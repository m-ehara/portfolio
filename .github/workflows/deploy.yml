name: CI & Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-and-test:
    name: Lint, Format, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Oxlint
        run: pnpm run lint

      - name: Check formatting with Oxfmt
        run: pnpm run fmt:check

      - name: Run unit tests with Vitest
        run: pnpm run test

      - name: Build application
        run: pnpm run build
        env:
          VITE_IGNORE_PRIVATE_DATA: "true"
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    name: Deploy to Cloudflare Workers
    needs: quality-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Check Cloudflare credentials
        id: cf_creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials are not configured (e.g. in a fork). Skipping deployment."
          else
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Inject KV Namespace binding into wrangler.jsonc
        if: steps.cf_creds.outputs.has_creds == 'true'
        env:
          KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          node -e '
            const kvId = (process.env.KV_NAMESPACE_ID || "").trim();
            if (!kvId) {
              console.log("CLOUDFLARE_KV_NAMESPACE_ID secret is not set; skipping PORTFOLIO_KV binding injection.");
              process.exit(0);
            }
            const fs = require("node:fs");
            const raw = fs.readFileSync("wrangler.jsonc", "utf8");
            const cfg = JSON.parse(raw);
            cfg.kv_namespaces = [{ binding: "PORTFOLIO_KV", id: kvId }];
            fs.writeFileSync("wrangler.jsonc", JSON.stringify(cfg, null, 2) + "\n");
          '

      - name: Deploy with Wrangler
        if: steps.cf_creds.outputs.has_creds == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.0"
          secrets: |
            BASIC_AUTH_USER
            BASIC_AUTH_PASS
            TURNSTILE_SECRET_KEY
        env:
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
